name: Deploy Inkstone to Cloudflare Workers (KV Mode)

on:
  push:
    branches:
      - main     # 如果你的默认分支是 master，请修改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # 使用 wrangler-action 执行自定义的 kv 部署命令
      - name: Publish to Cloudflare Workers (KV)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: run deploy:kv
